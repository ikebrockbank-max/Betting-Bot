name: Morning Brief (9 AM)

# ONE combined push: yesterday's scorecard + today's picks + today's locks.
# Replaces the separate scorecard/picks morning pushes so the user gets a
# single notification with everything (they were seeing a bare "Scorecard"
# with no picks). Retry ladder + sent-today marker: first slot that gets
# picks sends and marks; later slots exit. 9 AM MDT primary.

on:
  schedule:
    # GitHub's scheduler is best-effort and runs top-of-hour crons (:00)
    # 30-90 min late under load — the 15:00 slot was landing at 17:00+.
    # Fix: schedule EARLY at off-peak odd minutes so that even with the
    # usual delay the brief arrives around 9 AM MDT, and stack several
    # slots (sent-today dedup means only the first success actually sends).
    - cron: '37 14 * * *'   # ~8:37 AM MDT — primary (early to absorb delay)
    - cron: '52 14 * * *'   # ~8:52 AM MDT — retry 1
    - cron: '17 15 * * *'   # ~9:17 AM MDT — retry 2
    - cron: '47 15 * * *'   # ~9:47 AM MDT — retry 3
    - cron: '43 17 * * *'   # ~11:43 AM MDT — late retry (firmer lineups)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force resend even if already sent today'
        required: false
        default: 'false'

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore sent-marker cache
        uses: actions/cache@v4
        with:
          path: logs/
          key: digest-state-${{ github.run_id }}
          restore-keys: |
            digest-state-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send morning brief
        env:
          SUPABASE_URL:      https://gggozciyvjeqjnmufigp.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          ODDS_API_KEY:      ${{ secrets.ODDS_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          FORCE_RESEND:      ${{ github.event.inputs.force }}
        run: python3 morning_digest.py
      - name: Save sent-marker cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/
          key: digest-state-${{ github.run_id }}
