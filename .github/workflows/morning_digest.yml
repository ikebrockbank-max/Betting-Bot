name: Morning Brief (8 AM MDT)

# ONE combined push: yesterday's scorecard + today's picks + today's locks.
# Retry ladder + sent-today marker: first slot that gets picks sends and marks;
# later slots exit. TARGET: 8 AM MDT (= 14:00 UTC).

on:
  schedule:
    # Target 8 AM MDT = 14:00 UTC. GitHub's cron is UNRELIABLE — observed
    # firing 1-12h late (8/26 ~1h, 8/27 ~10h). Bias slots EARLY (11:30-14:00
    # UTC = 5:30-8:00 AM MDT) so a typical delay still lands in the morning
    # rather than the afternoon; being an hour or two early is fine — picks key
    # on the probable pitcher (known days ahead), not same-day lineups. Slots
    # are >=30 min apart so a delayed run's sent-marker cache has time to
    # propagate before the next slot fires (fixes the 8/27 double-push).
    # NOTE: cron alone can't beat GitHub's worst delays — a reliable external
    # workflow_dispatch trigger (cron-job.org) is the durable fix.
    - cron: '30 11 * * *'   # ~5:30 AM MDT — early primary (delay still lands AM)
    - cron: '0 12 * * *'    # retry 1
    - cron: '30 12 * * *'   # retry 2
    - cron: '0 13 * * *'    # retry 3
    - cron: '0 14 * * *'    # 8:00 AM MDT — catches on-time-firing days on target
  workflow_dispatch:
    inputs:
      force:
        description: 'Force resend even if already sent today'
        required: false
        default: 'false'

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore sent-marker cache
        uses: actions/cache@v4
        with:
          path: logs/
          key: digest-state-${{ github.run_id }}
          restore-keys: |
            digest-state-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send morning brief
        env:
          SUPABASE_URL:      https://gggozciyvjeqjnmufigp.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          ODDS_API_KEY:      ${{ secrets.ODDS_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          RAPIDAPI_KEY:      ${{ secrets.RAPIDAPI_KEY }}
          FORCE_RESEND:      ${{ github.event.inputs.force }}
        run: python3 morning_digest.py
      - name: Save sent-marker cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/
          key: digest-state-${{ github.run_id }}
