name: Morning Brief (9 AM)

# ONE combined push: yesterday's scorecard + today's picks + today's locks.
# Replaces the separate scorecard/picks morning pushes so the user gets a
# single notification with everything (they were seeing a bare "Scorecard"
# with no picks). Retry ladder + sent-today marker: first slot that gets
# picks sends and marks; later slots exit. 9 AM MDT primary.

on:
  schedule:
    # GitHub's scheduler runs jobs ~2 HOURS late under load (14:37 slots were
    # landing 17:00-19:00 UTC). Schedule ~2h EARLIER so the delayed run lands
    # near 9 AM MDT. Star/Lock quality is unaffected by the early time — they
    # key on the probable pitcher (known days ahead), not same-day lineups.
    # Sent-today dedup means only the first successful slot actually sends.
    - cron: '37 12 * * *'   # ~6:37 AM MDT — primary (absorbs ~2h delay → ~9 AM)
    - cron: '52 12 * * *'   # retry 1
    - cron: '17 13 * * *'   # retry 2
    - cron: '47 13 * * *'   # retry 3
    - cron: '43 15 * * *'   # late retry (firmer lineups)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force resend even if already sent today'
        required: false
        default: 'false'

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore sent-marker cache
        uses: actions/cache@v4
        with:
          path: logs/
          key: digest-state-${{ github.run_id }}
          restore-keys: |
            digest-state-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send morning brief
        env:
          SUPABASE_URL:      https://gggozciyvjeqjnmufigp.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          ODDS_API_KEY:      ${{ secrets.ODDS_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          RAPIDAPI_KEY:      ${{ secrets.RAPIDAPI_KEY }}
          FORCE_RESEND:      ${{ github.event.inputs.force }}
        run: python3 morning_digest.py
      - name: Save sent-marker cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/
          key: digest-state-${{ github.run_id }}
